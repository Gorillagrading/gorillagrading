<style>
:root{
  /* Gris pálido, muy ligeramente verdoso: el fondo no compite
     con el verde de marca y hace de neutro cálido. */
  /* Gris neutro puro. Sin matiz verde: el verde queda solo
     para el logo y los acentos. */
  --forest:#3B803C; --mint:#61B663; --ink:#454545;
  --bone:#F0F1F2; --dim:#8E9294;
  --display:"Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",monospace;
  --ease:cubic-bezier(.22,.68,.28,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--bone);
  font-family:var(--display); -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  gap:clamp(30px,6vw,90px); padding:28px 28px 60px; overflow:auto; text-align:center;
}
@media(max-width:900px){ body{flex-direction:column; gap:0; padding-bottom:40px} }

/* Franja verde arriba + retícula muy tenue. Un halo verde suave
   detrás, sin movimiento: da profundidad sin parecer un degradado. */

/* Retícula: se difumina hacia el centro con una máscara, así las
   líneas no cruzan por detrás del texto. */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  /* fondo liso: sin retícula ni degradados */
}

/* Halo verde: fuera del centro, apoyado abajo a la izquierda,
   y mucho más leve que antes. */
.glow{display:none}
.glow-2{display:none}
@keyframes breathe{
  0%,100%{transform:translate3d(0,0,0) scale(1); opacity:1}
  50%    {transform:translate3d(3%,-3%,0) scale(1.14); opacity:.68}
}

/* Escudo: flota apenas y refleja al pasar el ratón */
.logo{will-change:transform}
.logo-hold{
  display:block; width:78px; margin:0 auto 18px;
  animation:rise .8s var(--ease) backwards, float 5s ease-in-out 1s infinite;
  transition:transform .5s cubic-bezier(.22,.68,.28,1);
}
/* El escudo flota y bascula: más recorrido y una ligera rotación,
   para que no parezca que solo sube y baja. */
@keyframes float{
  0%,100%{transform:translateY(-9px) rotate(-1.6deg)}
  25%    {transform:translateY(0)    rotate(0.8deg)}
  50%    {transform:translateY(9px)  rotate(1.6deg)}
  75%    {transform:translateY(0)    rotate(-0.8deg)}
}

/* La línea bajo el nombre se dibuja al cargar */
.rule{transform-origin:center; animation:rise .8s var(--ease) .2s backwards, draw 1s var(--ease) .5s backwards}
@keyframes draw{from{transform:scaleX(0)} to{transform:scaleX(1)}}

/* El texto de la tagline entra letra a letra */
.tagline span{display:inline-block; animation:up .5s var(--ease) backwards}
@keyframes up{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

.card{position:relative; z-index:2; width:100%; max-width:400px; flex-shrink:0;
  display:flex; flex-direction:column; align-items:center}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

.logo{width:78px; height:84px; display:block}
.logo .shield{fill:var(--mint)}


h1{font-size:34px; font-weight:800; letter-spacing:-.025em; margin:0; line-height:1;
  animation:rise .8s var(--ease) .08s backwards}
.tagline{font-family:var(--display); font-weight:500; font-size:12px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--mint); margin:6px 0 0;
  /* el letter-spacing deja un hueco tras la última letra que
     descentra el texto: se compensa empujándolo esa misma medida */
  text-indent:.3em;
  animation:rise .8s var(--ease) .14s backwards}
.rule{height:1px; width:44px; margin:20px auto; background:var(--mint); opacity:.55;
  animation:rise .8s var(--ease) .2s backwards}
.claim{font-size:14.5px; color:#B8BCBE; line-height:1.6; margin:0 auto; max-width:34ch;
  animation:rise .8s var(--ease) .26s backwards}
.claim b{color:var(--bone); font-weight:600}

/* ---------- casillas de código ---------- */
.gate{margin-top:28px; animation:rise .8s var(--ease) .34s backwards}
.gate-lbl{font-family:var(--display); font-weight:500; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:#8E9294; margin:0 0 12px; text-indent:.16em}

@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
  40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(3px)}
}

.msg{font-family:var(--display); font-size:12px; letter-spacing:.02em; text-indent:.02em; margin-top:12px;
  min-height:16px; color:#8E9294; transition:color .25s}
.msg.err{color:#E86A5A}
.msg.ok{color:var(--mint)}

.foot{margin-top:34px; font-family:var(--display); font-size:12px; letter-spacing:.02em; text-indent:.02em; color:#3E4A44; animation:rise .8s var(--ease) .42s backwards}


/* ---------- hecho con amor ---------- */
.madewith{
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-family:var(--display); font-size:12px; color:#8E9294; margin:8px 0 0;
  animation:rise .8s var(--ease) .48s backwards;
}
.heart{display:inline-flex; width:15px; height:14px; flex-shrink:0}
.heart svg{width:100%; height:100%; display:block; fill:#D41A22;
  animation:beat 2s cubic-bezier(.3,.7,.3,1) infinite; transform-origin:center}
/* Latido de verdad: dos golpes seguidos, más amplios. */
@keyframes beat{
  0%,58%,100%{transform:scale(1)}
  64%{transform:scale(1.42)}
  70%{transform:scale(1.04)}
  76%{transform:scale(1.3)}
  84%{transform:scale(1)}
}

/* ---------- escena · antes y después ----------
   Ciclo de 24 s: se dibujan las cartas sueltas, corre el análisis
   por sus tres canales, baja la flecha con los cuatro colores, y
   se dibuja la carcasa con su nota y su certificado. */
.scene{
  position:relative; z-index:1; flex-shrink:0;
  width:min(27vw,258px); pointer-events:none;
}
@media(max-width:900px){ .scene{width:min(58vw,226px); margin-top:24px} }
.scene svg{width:100%; height:auto; display:block}

/* ══ el trazo a mano se dibuja solo ══ */
.d-duda path, .d-raw path, .d-raw rect, .d-raw circle,
.d-flecha path, .d-slab path, .d-slab rect, .d-slab circle{
  stroke-dasharray:var(--l,700); stroke-dashoffset:var(--l,700);
}
.d-duda path{animation:traza 24s var(--ease) infinite}
.d-raw path, .d-raw rect, .d-raw circle{animation:traza 24s var(--ease) .6s infinite}
.d-flecha path{animation:traza 24s var(--ease) infinite}
.d-slab path, .d-slab rect, .d-slab circle{animation:trazaB 24s var(--ease) infinite}
@keyframes traza{
  0%      {stroke-dashoffset:var(--l,700)}
  10%,92% {stroke-dashoffset:0}
  97%,100%{stroke-dashoffset:var(--l,700)}
}
/* la flecha se traza justo antes de la carcasa */
.d-flecha path{animation-delay:0s}
.d-flecha .f1{animation:trazaF 24s var(--ease) infinite}
.d-flecha .f2{animation:trazaF 24s var(--ease) .25s infinite}
.d-flecha .f3{animation:trazaF 24s var(--ease) .45s infinite}
@keyframes trazaF{
  0%,52%  {stroke-dashoffset:var(--l,120)}
  60%,92% {stroke-dashoffset:0}
  97%,100%{stroke-dashoffset:var(--l,120)}
}
@keyframes trazaB{
  0%,62%  {stroke-dashoffset:var(--l,700)}
  76%,92% {stroke-dashoffset:0}
  97%,100%{stroke-dashoffset:var(--l,700)}
}

/* las cartas sueltas se mecen, como papel */
.d-raw{transform-origin:150px 170px; animation:mece 8s ease-in-out infinite}
@keyframes mece{
  0%,100%{transform:rotate(-.8deg) translateY(-2px)}
  50%    {transform:rotate(.8deg)  translateY(2px)}
}
/* el garabato tiembla un poco más: es la duda */
.d-duda{transform-origin:70px 40px; animation:tiembla 5s ease-in-out infinite}
@keyframes tiembla{
  0%,100%{transform:rotate(-2deg) scale(1)}
  50%    {transform:rotate(2deg)  scale(1.05)}
}
.d-int text{opacity:0; animation:interro 24s var(--ease) infinite}
.d-int .i2{animation-delay:.3s}
.d-int .i3{animation-delay:.6s}
@keyframes interro{
  0%,12%  {opacity:0; transform:translateY(6px)}
  16%,48% {opacity:1; transform:none}
  54%,100%{opacity:0}
}

/* ══ el análisis, sobre la carta ══ */
.an1{animation:vA 24s linear infinite}
.an2{animation:vB 24s linear infinite}
.an3{animation:vC 24s linear infinite}
@keyframes vA{0%,16%{opacity:0} 19%,27%{opacity:1} 30%,100%{opacity:0}}
@keyframes vB{0%,30%{opacity:0} 33%,39%{opacity:1} 42%,100%{opacity:0}}
@keyframes vC{0%,42%{opacity:0} 44%,50%{opacity:1} 53%,100%{opacity:0}}

.an1-s{animation:baja 24s linear infinite}
@keyframes baja{
  0%,17%  {transform:translateY(0);     opacity:0}
  19%     {opacity:1}
  25%     {transform:translateY(146px); opacity:1}
  27%,100%{transform:translateY(146px); opacity:0}
}
.an1-v{transform-origin:top; animation:crece 24s var(--ease) infinite}
@keyframes crece{0%,24%{transform:scaleY(0)} 26%,28%{transform:scaleY(1)} 30%,100%{transform:scaleY(0)}}

.an2 path{stroke-dasharray:36; stroke-dashoffset:36; animation:esq 24s var(--ease) infinite}
.an2 path:nth-child(2){animation-delay:.1s}
.an2 path:nth-child(3){animation-delay:.2s}
.an2 path:nth-child(4){animation-delay:.3s}
@keyframes esq{0%,33%{stroke-dashoffset:36} 36%,40%{stroke-dashoffset:0} 42%,100%{stroke-dashoffset:36}}
.an2-h circle{transform-origin:center; transform-box:fill-box; opacity:0;
  animation:sonar 2.4s var(--ease) infinite}
.an2-h circle:nth-child(2){animation-delay:8.4s}
@keyframes sonar{0%{opacity:.9; transform:scale(1)} 60%,100%{opacity:0; transform:scale(5)}}

.an3-h, .an3-s{animation:sube 24s linear infinite}
@keyframes sube{
  0%,43%  {transform:translateY(146px); opacity:0}
  45%     {opacity:1}
  50%     {transform:translateY(0);     opacity:1}
  52%,100%{transform:translateY(0);     opacity:0}
}
.an3 circle{transform-origin:center; transform-box:fill-box;
  animation:brota 24s var(--ease) infinite}
.an3 circle:nth-child(4){animation-delay:.15s}
@keyframes brota{0%,46%{opacity:0; transform:scale(.3)} 49%,51%{opacity:1; transform:scale(1)} 53%,100%{opacity:0}}
.an3 rect[stroke-dasharray]{animation:gira 3s linear infinite}
@keyframes gira{to{stroke-dashoffset:-22}}

/* la etiqueta del canal cambia de texto con el color */
.an-t{opacity:0; animation:etiqueta 24s steps(1) infinite}
@keyframes etiqueta{
  0%,17%  {opacity:0}
  19%,28% {opacity:1; fill:#5B92D6}
  30%,32% {opacity:0}
  34%,40% {opacity:1; fill:#CFA05A}
  42%,43% {opacity:0}
  45%,51% {opacity:1; fill:#D4695C}
  53%,100%{opacity:0}
}

/* ══ los cuatro colores bajan por la flecha ══ */
.d-chispas path{
  stroke-dasharray:14 110; stroke-dashoffset:124; opacity:0;
  animation:chispa 24s var(--ease) infinite;
}
.d-chispas .c2{animation-delay:.22s}
.d-chispas .c3{animation-delay:.44s}
.d-chispas .c4{animation-delay:.66s}
@keyframes chispa{
  0%,56%  {stroke-dashoffset:124; opacity:0}
  58%     {opacity:1}
  68%     {stroke-dashoffset:-14; opacity:1}
  70%,100%{stroke-dashoffset:-14; opacity:0}
}

/* ══ lo que aporta la máquina sobre la carcasa ══ */
.d-nota{opacity:0; transform-box:fill-box; transform-origin:center;
  animation:nota 24s var(--ease) infinite}
@keyframes nota{
  0%,76%  {opacity:0; transform:scale(.6)}
  80%     {opacity:1; transform:scale(1.16)}
  83%,92% {opacity:1; transform:scale(1)}
  97%,100%{opacity:0}
}
.d-subs text{opacity:0; animation:sub 24s var(--ease) infinite}
.d-subs .s2{animation-delay:.12s}
.d-subs .s3{animation-delay:.24s}
.d-subs .s4{animation-delay:.36s}
@keyframes sub{0%,82%{opacity:0; transform:translateY(5px)} 86%,92%{opacity:1; transform:none} 97%,100%{opacity:0}}
.d-subs text{transform-box:fill-box; transform-origin:center}

.d-cert{opacity:0; animation:cert 24s var(--ease) infinite}
@keyframes cert{0%,84%{opacity:0; transform:translateY(5px)} 87%,92%{opacity:1; transform:none} 97%,100%{opacity:0}}

.d-ok{opacity:0; transform-origin:248px 392px; animation:okk 24s var(--ease) infinite}
@keyframes okk{0%,86%{opacity:0; transform:scale(.6)} 89%,92%{opacity:1; transform:scale(1)} 97%,100%{opacity:0}}
.d-tick{animation:tick 24s var(--ease) infinite}
@keyframes tick{0%,88%{stroke-dashoffset:24} 90%,92%{stroke-dashoffset:0} 97%,100%{stroke-dashoffset:24}}

/* la carcasa respira una vez dibujada */
.d-slab{transform-origin:150px 479px; animation:respira 7s ease-in-out 8s infinite}
@keyframes respira{0%,100%{transform:scale(1)} 50%{transform:scale(1.015)}}

/* ---------- captura de correo ----------
   Mismo lenguaje que las casillas del código: marco fino que se
   enciende en verde al escribir, sin relleno ni redondeos. */
.mail{margin:0}
.mfield{
  display:flex; align-items:stretch;
  border:1px solid rgba(255,255,255,.18);
  transition:border-color .25s var(--ease);
}
.mfield:focus-within{border-color:var(--mint)}
.mfield input{
  flex:1; min-width:0; background:none; border:none; color:var(--bone);
  font-family:var(--display); font-size:14.5px; padding:14px 16px;
  letter-spacing:.01em;
}
.mfield input::placeholder{color:#8E9294}
.mfield input:focus{outline:none}
.mfield button{
  flex-shrink:0; width:52px; background:none; border:none;
  border-left:1px solid rgba(255,255,255,.18);
  color:var(--mint); cursor:pointer; display:grid; place-items:center;
  transition:background .22s, border-color .25s;
}
.mfield button svg{width:19px; height:19px; stroke:currentColor; fill:none;
  stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
  transition:transform .3s var(--ease)}
.mfield button:hover{background:rgba(97,182,99,.1)}
.mfield button:hover svg{transform:translateX(3px)}
.mfield:focus-within button{border-left-color:var(--mint)}

.mfield.err{border-color:#E86A5A; animation:shake .4s var(--ease)}
.mfield.err button{color:#E86A5A; border-left-color:#E86A5A}

/* al enviar, el campo se sustituye por el acuse */
.mfield.ok{border-color:var(--mint); background:rgba(97,182,99,.07)}
.mfield.ok input, .mfield.ok button{opacity:0; pointer-events:none}
.gate .listo{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  gap:9px; font-family:var(--display); font-size:14px; color:var(--mint); font-weight:600;
}
.mail{position:relative}
.mfield.ok ~ .listo, .mail.hecho .listo{display:flex}
.listo svg{width:17px; height:17px; stroke:var(--mint); fill:none; stroke-width:2.4;
  stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:26; stroke-dashoffset:26;
  animation:trazo .5s var(--ease) .15s forwards}
@keyframes trazo{to{stroke-dashoffset:0}}


/* ---------- segunda escena · el instrumental ----------
   Va al otro lado del bloque. Cuenta CÓMO se mide, mientras la
   primera cuenta QUÉ sale. Se oculta en pantallas estrechas:
   con tres columnas el texto perdería sitio. */
.esc-b svg{width:100%; height:auto; display:block}

/* el trazo a mano se dibuja, escalonado por instrumento */
.esc-b g[filter] path, .esc-b g[filter] rect, .esc-b g[filter] circle{
  stroke-dasharray:var(--l,600); stroke-dashoffset:var(--l,600);
  animation:t_traza 24s var(--ease) infinite;
}
@keyframes t_traza{
  0%      {stroke-dashoffset:var(--l,600)}
  12%,92% {stroke-dashoffset:0}
  97%,100%{stroke-dashoffset:var(--l,600)}
}
.t-carta  *{animation-delay:.4s}
.t-calibre *{animation-delay:.9s}
.t-medida *{animation-delay:1.2s}
.t-esquina *{animation-delay:1.5s}
.t-lupa   *{animation-delay:1.8s}
.t-mango{opacity:0; animation:t_sale 24s var(--ease) 2.2s infinite}
@keyframes t_sale{0%,10%{opacity:0} 16%,92%{opacity:1} 97%,100%{opacity:0}}

/* ── ultravioleta ── */
.t-haz{opacity:0; transform-origin:130px 62px; animation:t_haz 24s var(--ease) infinite}
@keyframes t_haz{
  0%,14%  {opacity:0; transform:scaleY(.2)}
  20%,40% {opacity:1; transform:scaleY(1)}
  46%,100%{opacity:0; transform:scaleY(1)}
}
.t-nm{opacity:0; animation:t_apar 24s var(--ease) infinite}
@keyframes t_apar{0%,16%{opacity:0} 21%,40%{opacity:1} 46%,100%{opacity:0}}
.t-manchas path, .t-manchas g{opacity:0; transform-origin:center; transform-box:fill-box;
  animation:t_mancha 24s var(--ease) infinite}
.t-manchas .m2{animation-delay:.25s}
.t-manchas .m3{animation-delay:.5s}
@keyframes t_mancha{
  0%,20%  {opacity:0; transform:scale(.6)}
  25%,40% {opacity:.85; transform:scale(1)}
  46%,100%{opacity:0}
}
.t-et text{opacity:0; animation:t_et 24s var(--ease) infinite}
.t-et .e2{animation-delay:.25s}
.t-et .e3{animation-delay:.5s}
@keyframes t_et{0%,23%{opacity:0; transform:translateX(4px)} 28%,40%{opacity:1; transform:none} 46%,100%{opacity:0}}

/* ── pie de rey: la mordaza se cierra ── */
.t-mordaza{animation:t_cierra 24s var(--ease) infinite}
@keyframes t_cierra{
  0%,44%  {transform:translateX(26px)}
  54%,66% {transform:translateX(0)}
  72%,100%{transform:translateX(26px)}
}
.t-cota path{opacity:0; animation:t_cota 24s var(--ease) infinite}
.t-cota .c-r{animation-delay:.1s}
.t-cota .c-ln{opacity:0; transform-origin:left; animation:t_linea 24s var(--ease) infinite}
@keyframes t_cota{0%,54%{opacity:0} 58%,66%{opacity:1} 72%,100%{opacity:0}}
@keyframes t_linea{0%,55%{opacity:0; transform:scaleX(0)} 60%,66%{opacity:.6; transform:scaleX(1)} 72%,100%{opacity:0}}
.t-mm{opacity:0; transform-box:fill-box; transform-origin:center;
  animation:t_mm 24s var(--ease) infinite}
@keyframes t_mm{
  0%,57%  {opacity:0; transform:scale(.7)}
  61%     {opacity:1; transform:scale(1.12)}
  64%,66% {opacity:1; transform:scale(1)}
  72%,100%{opacity:0}
}

/* ── esquina bajo la lupa ── */
.t-lupa{transform-origin:134px 446px; animation:t_mueve 9s ease-in-out infinite}
@keyframes t_mueve{
  0%,100%{transform:translate(0,0) scale(1)}
  50%    {transform:translate(-4px,-5px) scale(1.04)}
}
.t-angulo path, .t-angulo circle{opacity:0;
  animation:t_ang 24s var(--ease) infinite}
.t-angulo .g2{animation-delay:.2s}
.t-angulo .g3{animation-delay:.4s}
@keyframes t_ang{0%,70%{opacity:0} 75%,92%{opacity:1} 97%,100%{opacity:0}}
.t-grados{opacity:0; animation:t_grad 24s var(--ease) infinite}
@keyframes t_grad{0%,74%{opacity:0; transform:translateY(4px)} 78%,92%{opacity:1; transform:none} 97%,100%{opacity:0}}

/* ── rótulos de cada instrumento ── */
.t-rot text{opacity:0; animation:t_rot 24s var(--ease) infinite}
.r1{animation-name:t_r1} .r2{animation-name:t_r2} .r3{animation-name:t_r3}
@keyframes t_r1{0%,15%{opacity:0} 20%,40%{opacity:1} 46%,100%{opacity:0}}
@keyframes t_r2{0%,45%{opacity:0} 50%,66%{opacity:1} 72%,100%{opacity:0}}

/* ---------- las dos escenas se turnan ----------
   Las dos viven en el mismo hueco. La que no se ve tiene sus
   animaciones EN PAUSA, no detenidas: al volver a su turno
   retoma justo donde se quedó. Como ambas duran 24 s y el
   relevo es cada 24 s, cada una reanuda en el arranque exacto
   de su propio bucle. */
.scene{position:relative}
.esc{transition:opacity 1s var(--ease)}
.esc-b{position:absolute; inset:0; display:grid; place-items:center;
  transform:scale(.9); transform-origin:center}
.esc:not(.on){opacity:0}
.esc:not(.on) *{animation-play-state:paused !important}
.esc.on{opacity:1}
.esc.on *{animation-play-state:running}
@media(max-width:600px){
  html,body{height:auto}
  body{
    min-height:100vh; min-height:100svh;
    justify-content:flex-start;
    padding:max(22px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
  }
  .card{max-width:380px}
  .logo-hold{width:66px; margin-bottom:14px}
  .logo{width:66px; height:72px}
  h1{font-size:30px}
  .rule{margin:16px auto}
  .claim{font-size:14px}
  .gate{margin-top:22px}
  .mfield{min-height:50px}
  .mfield input{font-size:16px; padding:14px 13px}
  .foot{margin-top:26px; color:#A3A6A8}
  .scene{width:min(52vw,184px); margin-top:20px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important} .scene{display:none} }
</style>
</head>

  void marco.offsetWidth;            // reinicia la animación
  marco.classList.add("err");
  msg.className = "msg err";
  msg.textContent = texto;
  campo.focus();
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  if(enviando) return;

  const valor = campo.value.trim();
  if(!valor)          return fallo("enter your email");
  if(!VALIDO.test(valor)) return fallo("that doesn't look like an email");
  if(!ENDPOINT)       return fallo("sign-up is being set up · try again soon");

  enviando = true;
  msg.className = "msg";
  msg.textContent = "sending…";

  try{
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: {"Content-Type":"application/json", "Accept":"application/json"},
      body: JSON.stringify({
        email: valor,
        source: "coming-soon",
        _subject: "Nuevo lead | Gorilla Grading"
      })
    });
    if(!r.ok) throw new Error(r.status);

    marco.classList.add("ok");
    form.classList.add("hecho");
    msg.className = "msg ok";
    msg.textContent = "we'll email you when we open";
  }catch(err){
    enviando = false;
    fallo("something went wrong · try again");
  }
});

campo.addEventListener("input", () => {
  marco.classList.remove("err");
  if(msg.textContent && !enviando){ msg.className = "msg"; msg.textContent = ""; }
});

campo.focus();

/* ============================================================
   MOVIMIENTO
   ============================================================ */
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

if(!reduce){
  /* la tagline entra letra a letra */
  const tag = document.getElementById("tagline");
  if(tag){
    const txt = tag.textContent.trim();
    tag.innerHTML = [...txt].map((c,i) =>
      `<span style="animation-delay:${360 + i*55}ms">${c}</span>`).join("");
  }

  /* el escudo se inclina siguiendo el cursor */
  const hold = document.getElementById("logoHold");
  if(hold){
    let raf;
    addEventListener("pointermove", e => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const px = (e.clientX / innerWidth  - .5);
        const py = (e.clientY / innerHeight - .5);
        hold.style.transform =
          `perspective(700px) rotateY(${px * 16}deg) rotateX(${-py * 12}deg)`;
      });
    });
    addEventListener("pointerleave", () => hold.style.transform = "");
  }

  /* el campo entra un punto después que el texto */
  const mf = document.getElementById("mfield");
  if(mf) mf.style.animation = "rise .6s var(--ease) 440ms backwards";
}
/* ============================================================
   ESCENA A PLUMILLA · longitud de cada trazo
   El dibujado se hace con stroke-dasharray. Para que cada línea
   se trace entera hace falta su longitud real: la pide el propio
   navegador con getTotalLength(), en vez de estimarla.
   ============================================================ */
(function(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  document.querySelectorAll(".scene svg").forEach(svg => {

  svg.querySelectorAll("g[filter] path, g[filter] rect, g[filter] circle").forEach(el => {
    let L;
    try{ L = el.getTotalLength(); }catch(e){ L = 0; }
    if(!L || !isFinite(L)){
      // rect y circle no siempre responden: se calcula a mano
      if(el.tagName === "rect"){
        const w = +el.getAttribute("width") || 0, h = +el.getAttribute("height") || 0;
        L = 2*(w+h);
      }else if(el.tagName === "circle"){
        L = 2 * Math.PI * (+el.getAttribute("r") || 0);
      }else{
        L = 600;
      }
    }
    el.style.setProperty("--l", Math.ceil(L + 2));
  });
  });
})();

/* ============================================================
   RELEVO ENTRE LAS DOS ESCENAS
   Cada 24 s cambia el turno. La que sale se queda en pausa, así
   que al volver arranca limpia en vez de aparecer a mitad.
   ============================================================ */
(function(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const escenas = [...document.querySelectorAll(".scene .esc")];
  if(escenas.length < 2) return;
  let i = 0;
  setInterval(() => {
    escenas[i].classList.remove("on");
    i = (i + 1) % escenas.length;
    escenas[i].classList.add("on");
  }, 24000);
})();

</script>
